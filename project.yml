name: LassoCropper
options:
  bundleIdPrefix: dev.onecat
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QZZ878S3NS
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    PRODUCT_BUNDLE_IDENTIFIER: dev.onecat.lasso-export
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_ENTITLEMENTS: Resources/LassoCropper.entitlements
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  LassoCropper:
    type: application
    platform: macOS
    sources:
      - path: Sources/LassoCropper
        type: group
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: LassoCropper
        PRODUCT_MODULE_NAME: LassoCropper
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    scheme:
      testTargets: []
schemes:
  LassoCropper:
    build:
      targets:
        LassoCropper: all
    run:
      config: Debug
    archive:
      config: Release
  LassoCropper App Store:
    build:
      targets:
        LassoCropper: all
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
  LassoCropper Direct:
    build:
      targets:
        LassoCropper: all
    run:
      config: Release
    archive:
      config: Release
